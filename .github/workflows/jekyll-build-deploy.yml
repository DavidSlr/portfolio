name: Jekyll site CI
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build the site with the project's Docker image
      # Uses the same image (./Dockerfile) and command as `./build.sh prod`, so the
      # local build and this one are identical. Gem versions come from Gemfile.lock.
      # Two config files: _config_prod.yml overrides _config.yml for production.
      run: |
        docker build -t portfolio-jekyll .
        docker run --rm -v "${{ github.workspace }}":/site portfolio-jekyll \
          bundle exec jekyll build --destination _prod_site/ --config _config.yml,_config_prod.yml
    - name: Build and Deploy to Netlify
      uses: nwtgck/actions-netlify@v4
      with:
        publish-dir: './_prod_site'
        # Must match the branch this workflow triggers on. When it does not,
        # the action uploads a draft deploy that has to be published by hand
        # in the Netlify UI instead of going live.
        production-branch: main
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: "Deploy from GitHub Actions"
        enable-pull-request-comment: false
        enable-commit-comment: true
        overwrites-pull-request-comment: true
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      # Generous enough for a full re-upload of the site if Netlify's
      # per-file digest cache misses.
      timeout-minutes: 5
